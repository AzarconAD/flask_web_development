<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Group Portfolio{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="brand-logo">
                BSCPE 2-2
            </a>
            
            <nav class="nav-links">
                <a href="/" class="nav-item">Home</a>
                <a href="/profile" class="nav-item">About</a>
                <a href="/projects" class="nav-item">Portfolio</a>
            </nav>
        </div>
    </header>

    <div class="system-alerts">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
        
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <div class="music-player-container">
        <audio id="bg-music" loop>
            <source src="{{ url_for('static', filename='music/jazz1.mp3') }}" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <button onclick="toggleMusic()" class="music-btn" title="Play/Pause">
            <span id="music-icon">🎵</span>
        </button>

        <input type="range" id="volume-control" class="volume-slider" min="0" max="1" step="0.01" value="0.5" title="Volume">
    </div>

    <script>
        var music = document.getElementById("bg-music");
        var volumeControl = document.getElementById("volume-control");
        var musicIcon = document.getElementById("music-icon");

        // 1. Initialize Volume
        music.volume = volumeControl.value;

        // 2. Check if music was playing before page reload
        if (localStorage.getItem("musicPlaying") === "true") {
            var playPromise = music.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    musicIcon.innerHTML = "⏸";
                }).catch(error => {
                    console.log("Autoplay prevented by browser.");
                    musicIcon.innerHTML = "🎵";
                    localStorage.setItem("musicPlaying", "false");
                });
            }
        }

        // 3. Toggle Function
        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicIcon.innerHTML = "⏸";
                localStorage.setItem("musicPlaying", "true");
            } else {
                music.pause();
                musicIcon.innerHTML = "🎵";
                localStorage.setItem("musicPlaying", "false");
            }
        }

        // 4. Volume Control Listener
        volumeControl.addEventListener("input", function() {
            music.volume = this.value;
        });
    </script>
</body>
</html>
