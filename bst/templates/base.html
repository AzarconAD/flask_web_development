<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Group Portfolio{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <style>
        /* GLOBAL VARIABLES - VINTAGE OLD MONEY THEME */
        :root {
            --bg-color: #FDFBF7;       /* Ivory/Cream */
            --nav-bg: #FFFFFF;         /* White */
            --text-main: #2B1D0E;      /* Dark Coffee */
            --text-light: #5C4033;     /* Mocha */
            
            --accent-gold: #D4AF37;    /* Metallic Gold */
            --accent-green: #355E3B;   /* Hunter Green */
            --accent-red: #800020;     /* Burgundy */
            
            --font-heading: 'Playfair Display', serif;
            --font-accent: 'Cinzel', serif;
            --font-body: 'Lora', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
            /* Subtle paper texture overlay effect */
            background-image: linear-gradient(to right, rgba(0,0,0,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- CLASSIC NAVIGATION BAR --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: var(--nav-bg);
            border-bottom: 3px double var(--accent-gold);
            box-shadow: 0 4px 15px rgba(43, 29, 14, 0.05);
            padding: 0 40px;
            height: 80px;
        }

        .nav-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo / Group Name */
        .brand-logo {
            font-family: var(--font-accent);
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 2px;
            border: 2px solid var(--text-main);
            padding: 5px 15px;
            transition: all 0.3s ease;
        }

        .brand-logo:hover {
            background-color: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
        }

        /* Nav Links */
        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-item {
            position: relative;
            color: var(--text-light);
            text-decoration: none;
            font-family: var(--font-accent);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 5px 0;
            transition: color 0.3s ease;
            letter-spacing: 1px;
        }

        /* Elegant Underline Hover Effect */
        .nav-item::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: var(--accent-gold);
            transition: width 0.3s ease;
        }

        .nav-item:hover {
            color: var(--accent-gold);
        }

        .nav-item:hover::after {
            width: 100%;
        }

        /* --- NOTIFICATION CARDS (FLASH MESSAGES) --- */
        .system-alerts {
            position: fixed;
            top: 100px;
            right: 30px;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .alert {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-left: 4px solid var(--text-main);
            color: var(--text-main);
            padding: 20px 30px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            animation: slideIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            min-width: 320px;
            max-width: 450px;
            position: relative;
        }
        
        .alert.error { border-left-color: var(--accent-red); background-color: #FFF5F5; }
        .alert.success { border-left-color: var(--accent-green); background-color: #F6FFF6; }
        .alert.info { border-left-color: var(--accent-gold); background-color: #FFFFFA; }

        .alert span::before {
            content: '✦ ';
            color: inherit;
            margin-right: 8px;
        }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        main {
            padding-top: 80px;
            min-height: 100vh;
        }

        /* --- MUSIC PLAYER STYLES --- */
        .music-player-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 50px;
            border: 1px solid var(--accent-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .music-player-container:hover {
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }

        .music-btn {
            background: var(--text-main);
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: var(--text-light);
        }

        /* Custom Volume Slider */
        .volume-slider {
            appearance: none;
            width: 80px;
            height: 4px;
            background: var(--text-light);
            border-radius: 2px;
            outline: none;
            opacity: 0.7;
            transition: opacity .2s;
        }

        .volume-slider:hover {
            opacity: 1;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-gold);
            cursor: pointer;
            border: 1px solid var(--text-main);
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-gold);
            cursor: pointer;
            border: 1px solid var(--text-main);
        }
    </style>
</head>
<body>
    
    <header>
        <div class="nav-container">
            <a href="/" class="brand-logo">
                BSCPE 2-2
            </a>
            
            <nav class="nav-links">
                <a href="/" class="nav-item">Home</a>
                <a href="/profile" class="nav-item">About</a>
                <a href="/projects" class="nav-item">Portfolio</a>
            </nav>
        </div>
    </header>

    <div class="system-alerts">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
        
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <div class="music-player-container">
        <audio id="bg-music" loop>
            <source src="{{ url_for('static', filename='music/jazz1.mp3') }}" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <button onclick="toggleMusic()" class="music-btn" title="Play/Pause">
            <span id="music-icon">🎵</span>
        </button>

        <input type="range" id="volume-control" class="volume-slider" min="0" max="1" step="0.01" value="0.5" title="Volume">
    </div>

    <script>
        var music = document.getElementById("bg-music");
        var volumeControl = document.getElementById("volume-control");
        var musicIcon = document.getElementById("music-icon");
        
        // 1. Initialize Volume
        music.volume = volumeControl.value;

        // 2. Check if music was playing before page reload
        if (localStorage.getItem("musicPlaying") === "true") {
            var playPromise = music.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    musicIcon.innerHTML = "⏸";
                }).catch(error => {
                    console.log("Autoplay prevented by browser.");
                    musicIcon.innerHTML = "🎵";
                    localStorage.setItem("musicPlaying", "false");
                });
            }
        }

        // 3. Toggle Function
        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicIcon.innerHTML = "⏸";
                localStorage.setItem("musicPlaying", "true");
            } else {
                music.pause();
                musicIcon.innerHTML = "🎵";
                localStorage.setItem("musicPlaying", "false");
            }
        }

        // 4. Volume Control Listener
        volumeControl.addEventListener("input", function() {
            music.volume = this.value;
        });
    </script>
    
</body>
</html>
